  // A transient line that clears itself -- used for the "sent" confirmation
  // and for nudges, so neither one outlives the moment it belongs to.
  function askFlash(ms){
    if (S.askFade) clearTimeout(S.askFade);
    var sid = S.askSession;
    S.askFade = setTimeout(function(){
      if (sid !== S.askSession) return;
      S.askFade = null;
      S.askTurns = [];
      S.askErr = null;
      S.askNote = null;
      renderAsk();
    }, ms);
  }

  function askSend(){
    var box = el("askInput");
    var msg = box.value.trim();
    if (S.askBusy || !S.sample) return;
    if (!msg){
      S.askNote = "Nothing to send yet — say what you need first.";
      renderAsk();
      askFlash(2500);
      return;
    }
    if (S.askFade){ clearTimeout(S.askFade); S.askFade = null; }
    box.value = "";
    box.style.height = "auto";
    S.askTurns.push({ role:"user", content: msg });
    S.askErr = null;
    S.askNote = null;
    S.askLive = "";
    S.askBusy = true;
    S.askToolRan = false;
    var sid = S.askSession;
    renderAsk();

    S.askCtl = new AbortController();
    var turns = [{ role:"user", content: ASK_RULES + askSnapshot() }].concat(
      S.askTurns.slice(-8)
    );

    S.sample(turns, {
      tools: askTools,
      modelTier: "quick",
      signal: S.askCtl.signal,
      onText: function(u){
        if (sid !== S.askSession) return;
        S.askLive = u.text; renderAsk();
      }
    }).then(function(r){
      // Closed or reset while this was in flight: the write still landed in the
      // book, but this panel has moved on, so don't repaint it.
      if (sid !== S.askSession) return;
      S.askBusy = false;
      S.askLive = "";
      var reply = String((r && r.text) || "");
      S.askTurns.push({ role:"assistant", content: reply });
      renderAsk();
      // A finished action is just a receipt -- let it go. An answer, or a
      // question back to him, is the thing he came for, so it stays put until
      // he closes.
      var asksBack = /\?\s*$/.test(reply.trim());
      if (S.askToolRan && !asksBack) askFlash(4000);
    }).catch(function(e){
      if (sid !== S.askSession) return;
      S.askBusy = false;
      S.askLive = "";
      if (e && e.text) S.askTurns.push({ role:"assistant", content: e.text });
      if (!e || e.code !== "cancelled") S.askErr = askCopy(e && e.code);
      renderAsk();
    });
  }

  el("askFab").addEventListener("click", function(){
    S.askOpen = true;
    askReset();
    el("askSheet").hidden = false;
    el("askFab").hidden = true;
    renderAsk();
    el("askInput").focus();
  });
  el("askClose").addEventListener("click", function(){
    S.askOpen = false;
    // Reset on the way out as well as the way in: anything still running
    // finishes against the book, it just has no panel to come back to.
    askReset();
    renderAsk();
    el("askSheet").hidden = true;
    el("askFab").hidden = !S.sample;
  });
  el("askStop").addEventListener("click", function(){
    if (S.askCtl) S.askCtl.abort();
  });
  el("askSend").addEventListener("click", askSend);
  el("askInput").addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); askSend(); }
  });
  el("askInput").addEventListener("input", function(){
    var t = el("askInput");
    t.style.height = "auto";
    t.style.height = Math.min(120, Math.max(46, t.scrollHeight)) + "px";
  });

  /* ---------- boot ---------- */

  render();

  (async function(){
    var db = null, user = null;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    try { user = await window.claude.use("user"); } catch (e) { user = null; }
    try { S.mcp = await window.claude.use("mcp"); } catch (e) { S.mcp = null; }
    try { S.sample = await window.claude.use("sample"); } catch (e) { S.sample = null; }
    if (S.sample && !S.askOpen) el("askFab").hidden = false;

    if (!db){
      S.loaded = true;
      setBanner("Can't reach your job book right now. Check your signal, then close and reopen the app.");
      lockWrites();
      render();
      return;
    }
    S.db = db; S.user = user;

    if (user){
      try { S.myId = await user.id(); } catch (e) { S.myId = null; }
      try {
        var can = await user.can("data.write");
        if (can === false) lockWrites();
      } catch (e) { /* keep inputs */ }
    }

    // Register this viewer in the roster, only when it's missing or the name changed.
    if (user && S.myId && S.canWrite){
      try {
        var mine = await user.me();
        var myName = (mine && mine.name) || "";
        var ref = db.collection("people").doc(S.myId);
        var snap = await ref.get();
        if (!snap.exists || (snap.data() || {}).name !== myName){
          await ref.set({ name: myName });
        }
      } catch (e) { /* roster is a nicety */ }
    }

    function onErr(e){
      if (e && e.code === "revoked"){ lockWrites(); render(); }
    }

    db.collection("jobs").onSnapshot(function(snap){
      S.jobs = snap.docs.map(function(d){
        var v = d.data() || {};
        /* Every field the app needs must be named here. A field left out is
           dropped on the way in, which is how the urgent flag went missing:
           it saved fine and was thrown away on load. `folder` is the job's
           folder on the F: drive -- Job Book owns it, and filing receipts
           reads it from here rather than from a hardcoded list that drifts
           every time a job folder is named differently from the job. */
        return { id:d.id, name:v.name || "Untitled job", archived:!!v.archived,
                 createdAt:v.createdAt || "", bookId:v.bookId || "",
                 status:v.status || "", waiting:!!v.waiting,
                 permits:(v.permits && typeof v.permits === "object") ? v.permits : {},
                 folder:v.folder || "" };
      });
      S.loaded = true;
      render();
    }, onErr);

    db.collection("books").onSnapshot(function(snap){
      S.books = snap.docs.map(function(d){
        var v = d.data() || {};
        return { id:d.id, name:v.name || "Untitled book", createdAt:v.createdAt || "" };
      });
      S.books.sort(function(a,b){ return (a.createdAt || "").localeCompare(b.createdAt || ""); });
      var known = S.books.some(function(b){ return b.id === S.bookId; });
      if (!known){
        var saved = recallBook();
        S.bookId = (saved && S.books.some(function(b){ return b.id === saved; })) ? saved : defaultBookId();
      }
      render();
    }, onErr);

    db.collection("notes").onSnapshot(function(snap){
      S.notes = snap.docs.map(function(d){
        var v = d.data() || {};
        return { id:d.id, jobId:v.jobId || "", text:v.text || "", done:!!v.done,
                 urgent:!!v.urgent, waiting:!!v.waiting,
                 createdAt:v.createdAt || "", assignedTo:v.assignedTo || "",
                 doneBy:v.doneBy || "", doneAt:v.doneAt || "",
                 scheduledAt:v.scheduledAt || "", scheduledEnd:v.scheduledEnd || "",
                 allDay:!!v.allDay };
      });
      render();
    }, onErr);

    db.collection("people").onSnapshot(async function(snap){
      S.people = snap.docs.map(function(d){
        var v = d.data() || {};
        return { id:d.id, name:v.name || "" };
      });
      if (user){
        try {
          var ids = S.people.map(function(p){ return p.id; });
          if (ids.length) S.profiles = await user.profiles(ids) || {};
        } catch (e) { /* names stay as stored */ }
      }
      render();
    }, onErr);
  })();
})();
</script>

</body></html>
